<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Quest</title>
<style>
:root{--bg:#fff8ee;--card:#fff;--ink:#2b2340;--mut:#7a7290;--line:#eadfcf;
--c1:#7c5cff;--c2:#16b57a;--c3:#ff8a3d;--c4:#ff5fa2;--c5:#18a9e0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17132a;--card:#241e3d;--ink:#f4efff;--mut:#a79fc4;--line:#3a3160;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nav button{background:var(--card);border:2px solid var(--line);color:var(--ink);border-radius:12px;padding:6px 12px;font-size:16px;cursor:pointer}
.hero{background:linear-gradient(135deg,var(--c1),var(--c4));color:#fff;border-radius:20px;padding:14px;margin:12px 0}
.hero .r{display:flex;justify-content:space-between;font-weight:700}
.bar{height:12px;background:rgba(255,255,255,.3);border-radius:9px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .4s}
.small{font-size:13px}
.tank,.area{background:var(--card);border-radius:18px;padding:12px;margin:12px 0;border:2px solid var(--line)}
.tank h3,.area h3{margin:0 0 6px;font-size:16px}
.sl{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:14px}
.sl span{width:64px}.sl input{flex:1}.sl b{width:22px;text-align:right}
.area{border-color:var(--col)}
.ah{display:flex;justify-content:space-between;align-items:center}
.ah h3{color:var(--col)}
.pill{font-size:12px;background:var(--col,var(--c1));color:#fff;border-radius:99px;padding:2px 9px}
.mini{height:6px;background:var(--line);border-radius:9px;margin:6px 0 8px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--col);transition:width .4s}
.t{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:12px;cursor:pointer;user-select:none}
.t:hover{background:var(--bg)}
.box{width:26px;height:26px;border-radius:9px;border:3px solid var(--col);flex:none;display:grid;place-items:center;color:#fff;font-weight:900}
.t.on .box{background:var(--col)}
.t.on .nm{opacity:.6}
.t.lock{opacity:.45;cursor:default}
.nm{flex:1}.nm small{display:block;color:var(--mut);font-size:12px}
.tm{font-size:12px;color:var(--mut)}
.pop{animation:p .35s}@keyframes p{50%{transform:scale(1.04)}}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;cursor:pointer}
.tabs button.a{background:var(--c1);color:#fff;border-color:var(--c1)}
.row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px}
.row span{width:110px}.row .bg{flex:1;height:14px;background:var(--line);border-radius:9px;overflow:hidden}
.row .bg i{display:block;height:100%}
.row b{width:40px;text-align:right}
textarea{width:100%;height:110px;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px;font:12px monospace;margin-top:8px}
.btn{background:var(--c1);color:#fff;border:0;border-radius:12px;padding:9px 14px;font-weight:700;cursor:pointer;margin-top:8px}
.days{display:flex;gap:6px;align-items:flex-end;margin-top:8px}
.days div{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.days i{display:block;background:var(--c2);border-radius:6px 6px 0 0;min-height:3px}
.dice{background:var(--col);color:#fff;border:0;border-radius:99px;padding:3px 10px;font-weight:700;font-size:13px;cursor:pointer;margin-right:6px}
.t.rolled{background:var(--bg);outline:2px dashed var(--col)}
.rb{font-size:11px;background:var(--col);color:#fff;border-radius:99px;padding:1px 7px;margin-left:6px}
.btn.off{opacity:.4;cursor:default}
.area.rolled{outline:3px dashed var(--col)}
.in{background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:7px;font-size:14px;width:48%}
.hide{display:none}
</style></head><body><div class="w">
<div class="top"><h1>⚔️ Daily Quest</h1><div class="nav"><button id="pv">‹</button> <button id="td">Today</button> <button id="nx">›</button></div></div>
<div id="dt" class="small" style="color:var(--mut);margin-top:4px"></div>
<div class="hero"><div class="r"><span id="lv"></span><span id="xp"></span></div>
<div class="bar"><i id="xb"></i></div><div class="small" id="hs"></div></div>
<div class="tabs"><button id="b1" class="a">Quest</button><button id="b2">Stats</button><button id="b3">🎁 Prizes</button></div>
<div id="v1"></div>
<div id="v2" class="hide"></div>
<div id="v3" class="hide"></div>
</div>
<script>
const AREAS=[
{id:"edu",n:"📚 Education",c:"--c1",win:"6:00–9:00 am",t:[
 {id:"nlp",n:"NLP course",s:"4 weeks · starts Nov 2",from:"2026-11-02",to:"2026-11-29"},
 {id:"hr",n:"HR course",s:"22 weeks · starts Nov 2",from:"2026-11-02",to:"2027-04-04"},
 {id:"conj",n:"Conjure Studio",s:"Thursdays",dow:4}]},
{id:"money",n:"💰 Money Channels",c:"--c2",win:"9:00 am–12:00 pm",t:[
 {id:"ugc",n:"UGC"},{id:"tankads",n:"Tank System ads"}]},
{id:"content",n:"📱 Content",c:"--c3",win:"12:00–3:00 pm",t:[
 {id:"scaries",n:"Sunday Scaries Insta series"},{id:"mainads",n:"Main Insta page ads"},{id:"sub",n:"Substack writing"}]},
{id:"mh",n:"🌿 Mental Health",c:"--c4",win:"3:00–6:00 pm",t:[
 {id:"write",n:"Writing"},{id:"work",n:"Working out"}]},
{id:"dev",n:"🛠️ Development",c:"--c5",win:"6:00–11:00 pm",t:[
 {id:"wsd",n:"Workshop development"},{id:"rd",n:"Tank system R+D"}]}];
const KEY="dq_v1";let S={};
try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){S={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
let cur=new Date();cur.setHours(12);
let M={};try{M=JSON.parse(localStorage.getItem('dq_meta')||'{}')}catch(e){M={}}
const saveM=()=>{try{localStorage.setItem('dq_meta',JSON.stringify(M))}catch(e){}};
if(!M.start)M.start=iso(new Date());
if(!M.prizes)M.prizes=[{id:'p1',n:'☕ Treat yourself (coffee/snack)',cost:300},{id:'p2',n:'📺 Guilt-free show hour',cost:600},{id:'p3',n:'📚 New book',cost:1200},{id:'p4',n:'💆 Self-care splurge',cost:2500},{id:'p5',n:'🌟 Big month-end prize',cost:5000}];
if(!M.spent)M.spent=[];
saveM();
const NN=[{id:'meds',n:'Take meds',pts:20,pen:15},{id:'puz',n:'Do puzzles',pts:20,pen:15},{id:'wo',n:'Workout',pts:20,pen:15}];
const day=k=>S[k]||(S[k]={done:{},nn:{},tank:{mood:5,motion:5,mind:5,set:0}});
function avail(a,k){const d=new Date(k+"T12:00");return a.t.filter(t=>{
 if(t.dow!==undefined&&d.getDay()!==t.dow)return false;
 if(t.from&&k<t.from)return false;if(t.to&&k>t.to)return false;return true})}
function allAvail(k){return AREAS.flatMap(a=>avail(a,k).map(t=>[a,t]))}
function dayXP(k){const dd=S[k];if(!dd)return 0;let x=0;
 AREAS.forEach(a=>{const av=avail(a,k);let n=0;av.forEach(t=>{if(dd.done[t.id]){x+=10;n++}});
  if(av.length&&n===av.length)x+=25});
 const av=allAvail(k);if(av.length&&av.every(([a,t])=>dd.done[t.id]))x+=50;
 if(dd.tank&&dd.tank.set)x+=5;return x}
function pct(k){const av=allAvail(k);if(!av.length)return 0;const dd=S[k];
 return dd?av.filter(([a,t])=>dd.done[t.id]).length/av.length:0}
function streak(){let n=0,d=new Date();d.setHours(12);
 if(pct(iso(d))<.6)d.setDate(d.getDate()-1);
 while(pct(iso(d))>=.6){n++;d.setDate(d.getDate()-1)}return n}
function tankType(t){const s=t.mood+t.motion+t.mind;return s<=15?["EMPTY 🪫",2]:s<=22?["HALF 🔋",4]:["FULL ⚡",6]}
function nnDone(k){return (S[k]&&S[k].nn)||{}}
function nnPts(k){const d=nnDone(k);let x=0,n=0;NN.forEach(t=>{if(d[t.id]){x+=t.pts;n++}});if(n===NN.length)x+=30;return x}
function nnPen(k){const d=nnDone(k);return NN.reduce((s,t)=>s+(d[t.id]?0:t.pen),0)}
function pastDays(){const o=[],t=iso(new Date());let d=new Date(M.start+'T12:00');while(iso(d)<t){o.push(iso(d));d.setDate(d.getDate()+1)}return o}
function earned(){let x=0;Object.keys(S).forEach(k=>{x+=dayXP(k)+nnPts(k)});pastDays().forEach(k=>{x-=nnPen(k)});return x}
function spent(){return M.spent.reduce((s,r)=>s+r.cost,0)}
function nnCard(k){const d=nnDone(k),n=NN.filter(t=>d[t.id]).length;
 let h=`<div class='area' style='--col:var(--c4)'><div class='ah'><h3>🔒 Non-negotiables</h3><span class='pill'>${n}/3</span></div><div class='tm'>+20 each · +30 bonus for all 3 · −15 per miss at midnight</div><div class='mini'><i style='width:${n/3*100}%'></i></div>`;
 NN.forEach(t=>{h+=`<div class='t ${d[t.id]?'on':''}' data-n='${t.id}'><div class='box'>${d[t.id]?'✓':''}</div><div class='nm'>${t.n}<small>${d[t.id]?'done '+d[t.id]+' · +'+t.pts:'−'+t.pen+' if missed'}</small></div></div>`});
 return h+'</div>'}
function prizes(){
 const bal=earned()-spent(),now=new Date(),dl=new Date(now.getFullYear(),now.getMonth()+1,0).getDate()-now.getDate();
 const rp=M.prizes.find(p=>p.id===M.rolled);
 let h=`<div class='hero' style='margin-top:12px'><div class='r'><span>🎁 Prize shop</span><span>${bal} pts</span></div><div class='small'>Month ends in ${dl} day${dl==1?'':'s'} · redeem anytime</div></div><button class='btn' id='proll' style='width:100%;margin:0 0 8px'>🎲 Roll for a prize</button><div id='pr' class='tm' style='margin-bottom:6px'>${rp?'🎲 Rolled: '+rp.n:''}</div>`;
 M.prizes.forEach(p=>{const can=bal>=p.cost;
  h+=`<div class='area ${M.rolled===p.id?'rolled':''}' style='--col:var(--c3)'><div class='ah'><h3>${p.n}</h3><span class='pill'>${p.cost} pts</span></div><div class='mini'><i style='width:${Math.min(100,Math.max(0,bal)/p.cost*100)}%'></i></div><button class='btn rd ${can?'':'off'}' data-p='${p.id}'>${can?'Redeem':'Need '+(p.cost-bal)+' more'}</button><button class='btn' data-x='${p.id}' style='background:var(--mut);margin-left:6px'>✕</button></div>`});
 h+=`<div class='area' style='--col:var(--c5)'><h3>➕ Add a prize</h3><input id='pn' class='in' placeholder='Prize'> <input id='pc' class='in' type='number' placeholder='Points'><br><button class='btn' id='pa'>Add</button></div>`;
 const hs=M.spent.slice(-5).reverse();
 if(hs.length)h+=`<div class='area' style='--col:var(--c2)'><h3>🎉 Redeemed</h3>${hs.map(r=>`<div class='row'><span style='width:auto;flex:1'>${r.d} · ${r.n}</span><b style='width:auto'>−${r.cost}</b></div>`).join('')}</div>`;
 $('v3').innerHTML=h;
 $('proll').onclick=()=>{const pool=M.prizes.filter(p=>p.cost<=bal),pr=$('pr');
  if(!pool.length){const c=M.prizes.slice().sort((a,b)=>a.cost-b.cost)[0];pr.textContent=c?'Nothing affordable yet. Closest: '+c.n+' ('+(c.cost-bal)+' pts away).':'Add a prize first.';return}
  const pick=pool[Math.floor(Math.random()*pool.length)];let i=0;
  const iv=setInterval(()=>{pr.textContent='🎲 '+pool[i++%pool.length].n},90);
  setTimeout(()=>{clearInterval(iv);M.rolled=pick.id;saveM();prizes()},900)};
 $('v3').querySelectorAll('.rd').forEach(b=>b.onclick=()=>{if(b.classList.contains('off'))return;const p=M.prizes.find(x=>x.id===b.dataset.p);M.spent.push({d:iso(new Date()),n:p.n,cost:p.cost});if(M.rolled===p.id)M.rolled=null;saveM();render()});
 $('v3').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{M.prizes=M.prizes.filter(p=>p.id!==b.dataset.x);saveM();prizes()});
 $('pa').onclick=()=>{const n=$('pn').value.trim(),c=parseInt($('pc').value);if(!n||!(c>0))return;M.prizes.push({id:'p'+Date.now(),n:n,cost:c});saveM();prizes()}}
function render(){
 const k=iso(cur),dd=day(k);
 $("dt").textContent=cur.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})+(k===iso(new Date())?" · today":"");
 const er=earned(),tot=Math.max(0,er),bal=er-spent();
 $("lv").textContent="Level "+(Math.floor(tot/1000)+1);$("xp").textContent=bal+" pts";
 $("xb").style.width=((tot%1000)/1000*100)+"%";
 const tt=tankType(dd.tank);
 $("hs").textContent="🔥 "+streak()+"-day streak (60%+ days) · "+(1000-tot%1000)+" pts to next level";
 let h=nnCard(k)+`<div class="tank"><h3>🔋 Tank check <span class="pill">${tt[0]}</span></h3>`;
 [["mood","Mood"],["motion","Motion"],["mind","Mindset"]].forEach(([f,l])=>{
  h+=`<div class="sl"><span>${l}</span><input type="range" min="0" max="10" value="${dd.tank[f]}" data-f="${f}"><b>${dd.tank[f]}</b></div>`});
 h+=`<div class="small" style="color:var(--mut)">Check in for +5 XP. Tank type is for your own data, tasks are never hidden.</div></div>`;
 AREAS.forEach(a=>{
  const av=avail(a,k),n=av.filter(t=>dd.done[t.id]).length;
  const p=av.length?n/av.length*100:0;
  h+=`<div class="area" style="--col:var(${a.c})"><div class="ah"><h3>${a.n}</h3><span><button class="dice" data-a="${a.id}">🎲 Roll</button><span class="pill">${n}/${av.length}</span></span></div>
  <div class="tm">${a.win}</div><div class="mini"><i style="width:${p}%"></i></div>`;
  a.t.forEach(t=>{
   const off=t.dow!==undefined&&cur.getDay()!==t.dow,pre=t.from&&k<t.from,post=t.to&&k>t.to;
   const lk=off||pre||post,on=dd.done[t.id];
   const sub=lk?(off?"Thursdays only":pre?"Unlocks "+t.from:"Course complete 🎉"):(t.s||"")+(on?(t.s?" · ":"")+"done "+dd.done[t.id]:"");
   h+=`<div class="t ${on?"on":""} ${lk?"lock":""} ${dd.roll&&dd.roll[a.id]===t.id&&!lk?"rolled":""}" data-t="${t.id}"><div class="box">${on?"✓":""}</div>
   <div class="nm">${t.n}${dd.roll&&dd.roll[a.id]===t.id&&!lk?'<span class="rb">🎲 rolled</span>':''}${sub?`<small>${sub}</small>`:""}</div></div>`});
  h+="</div>"});
 $("v1").innerHTML=h;
 $("v1").querySelectorAll("input[type=range]").forEach(r=>{r.oninput=()=>{
  dd.tank[r.dataset.f]=+r.value;dd.tank.set=1;save();r.nextElementSibling.textContent=r.value;
  const pl=document.querySelector(".tank .pill");if(pl)pl.textContent=tankType(dd.tank)[0]};
  r.onchange=()=>render()});
 $("v1").querySelectorAll(".t[data-t]").forEach(el=>el.onclick=()=>{
  if(el.classList.contains("lock"))return;const id=el.dataset.t;
  if(dd.done[id])delete dd.done[id];else{const d=new Date();dd.done[id]=d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")}
  save();render();const e2=document.querySelector(`[data-t="${id}"]`);if(e2)e2.classList.add("pop")});
 $("v1").querySelectorAll(".dice").forEach(b=>b.onclick=()=>{
  const a=AREAS.find(x=>x.id===b.dataset.a);
  const pool=avail(a,k).filter(t=>!dd.done[t.id]);
  if(!pool.length){b.textContent="✅ All done";return}
  const pick=pool[Math.floor(Math.random()*pool.length)];
  let i=0;const iv=setInterval(()=>{b.textContent="🎲 "+pool[i++%pool.length].n.slice(0,14)},90);
  setTimeout(()=>{clearInterval(iv);dd.roll=dd.roll||{};dd.roll[a.id]=pick.id;dd.rc=dd.rc||{};dd.rc[a.id]=(dd.rc[a.id]||0)+1;save();render()},900)});
 $("v1").querySelectorAll(".t[data-n]").forEach(el=>el.onclick=()=>{dd.nn=dd.nn||{};const id=el.dataset.n;if(dd.nn[id])delete dd.nn[id];else{const d=new Date();dd.nn[id]=d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")}save();render()});
 stats();prizes()}
function stats(){
 const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setHours(12);d.setDate(d.getDate()-i);days.push(d)}
 let h=`<div class="area" style="--col:var(--c1)"><h3>Last 7 days</h3><div class="days">`;
 days.forEach(d=>{const p=Math.round(pct(iso(d))*100);
  h+=`<div><i style="height:${p*.7}px"></i>${"SMTWTFS"[d.getDay()]}<br>${p}%</div>`});
 h+=`</div></div><div class="area" style="--col:var(--c3)"><h3>Completion by area</h3>`;
 AREAS.forEach(a=>{let d=0,t=0;Object.keys(S).forEach(k=>{const av=avail(a,k);t+=av.length;av.forEach(x=>{if(S[k].done[x.id])d++})});
  const p=t?Math.round(d/t*100):0;
  h+=`<div class="row"><span>${a.n}</span><div class="bg"><i style="width:${p}%;background:var(${a.c})"></i></div><b>${p}%</b></div>`});
 h+=`</div><div class="area" style="--col:var(--c2)"><h3>Tank vs. output</h3>`;
 const rows=Object.keys(S).filter(k=>S[k].tank&&S[k].tank.set);
 ["EMPTY","HALF","FULL"].forEach(ty=>{const ks=rows.filter(k=>tankType(S[k].tank)[0].startsWith(ty));
  const avg=ks.length?Math.round(ks.reduce((s,k)=>s+pct(k),0)/ks.length*100):0;
  h+=`<div class="row"><span>${ty} (${ks.length}d)</span><div class="bg"><i style="width:${avg}%;background:var(--c2)"></i></div><b>${avg}%</b></div>`});
 h+=`</div><div class="area" style="--col:var(--c5)"><h3>Your data</h3><div class="tm">Copy the CSV into a sheet any time.</div>
 <button class="btn" id="csv">Show CSV</button><textarea id="ta" class="hide" readonly></textarea></div>`;
 $("v2").innerHTML=h;
 $("csv").onclick=()=>{let o="date,mood,motion,mindset,tank,area,task,done_at,rolled\n";
  Object.keys(S).sort().forEach(k=>{const d=S[k],tk=d.tank;
   allAvail(k).forEach(([a,t])=>{o+=[k,tk.mood,tk.motion,tk.mind,tankType(tk)[0].split(" ")[0],a.id,t.id,d.done[t.id]||"",d.roll&&d.roll[a.id]===t.id?1:0].join(",")+"\n"})});
  Object.keys(S).sort().forEach(k=>{const d=nnDone(k),tk=S[k].tank;NN.forEach(t=>{o+=[k,tk.mood,tk.motion,tk.mind,tankType(tk)[0].split(" ")[0],"nonneg",t.id,d[t.id]||"",0].join(",")+"\n"})});$("ta").value=o;$("ta").classList.remove("hide");$("ta").select()}}
$("pv").onclick=()=>{cur.setDate(cur.getDate()-1);render()};
$("nx").onclick=()=>{cur.setDate(cur.getDate()+1);render()};
$("td").onclick=()=>{cur=new Date();cur.setHours(12);render()};
function tab(n){$("v1").classList.toggle("hide",n!==1);$("v2").classList.toggle("hide",n!==2);$("v3").classList.toggle("hide",n!==3);
 $("b1").className=n===1?"a":"";$("b2").className=n===2?"a":"";$("b3").className=n===3?"a":""}
$("b1").onclick=()=>tab(1);$("b2").onclick=()=>tab(2);$("b3").onclick=()=>tab(3);
render();
</script></body></html>
